<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | BHAR India</title>
  <meta name="description" content="The page you are looking for could not be found. Continue browsing BHAR India's automation, software, and contact pages." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://www.bharindia.com/404.html" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .error-shell { min-height: 100vh; display: flex; align-items: center; }
    .error-card { max-width: 720px; margin: 0 auto; padding: 48px 32px; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--bg-card); box-shadow: var(--shadow-md); text-align: center; }
    .error-code { display: inline-block; margin-bottom: 18px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .error-card h1 { margin-bottom: 16px; }
    .error-card p { margin: 0 auto 28px; max-width: 54ch; }
    .error-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="error-shell">
    <div class="container">
      <section class="error-card" aria-labelledby="not-found-title">
        <span class="error-code">Error 404</span>
        <h1 id="not-found-title">This page could not be found</h1>
        <p>The URL may be outdated, moved, or entered incorrectly. You can continue to the homepage, browse services, or contact BHAR India directly.</p>
        <div class="error-actions">
          <a href="index.html" class="btn btn-primary">Go to Home</a>
          <a href="pages/services.html" class="btn btn-secondary">View Services</a>
          <a href="pages/contact.html" class="btn btn-secondary">Contact Us</a>
        </div>
      </section>
    </div>
  </main>
  <script src="js/theme.js"></script>
</body>
</html>
