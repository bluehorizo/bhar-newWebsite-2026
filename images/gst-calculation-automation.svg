      <g transform="translate(190 92)">
        <rect width="124" height="86" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="18" y="30" font-size="14" fill="#1d4ed8">Taxable Value</text><text x="18" y="65" font-size="27" font-weight="800" fill="#061947">₹84.2L</text>
        <rect x="148" width="124" height="86" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/><text x="166" y="30" font-size="14" fill="#047857">GST Output</text><text x="166" y="65" font-size="27" font-weight="800" fill="#061947">₹15.1L</text>
        <rect x="296" width="124" height="86" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="314" y="30" font-size="14" fill="#c2410c">ITC Eligible</text><text x="314" y="65" font-size="27" font-weight="800" fill="#061947">₹9.8L</text>
        <rect x="444" width="124" height="86" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="462" y="30" font-size="14" fill="#b91c1c">Exceptions</text><text x="462" y="65" font-size="27" font-weight="800" fill="#061947">18</text>
      </g>
      <g transform="translate(190 214)">
        <rect width="260" height="196" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="34" font-size="18" font-weight="800" fill="#061947">GST Split</text>
        <circle cx="130" cy="112" r="54" fill="none" stroke="#2563eb" stroke-width="24"/>
        <path d="M130 58a54 54 0 0 1 48 78" fill="none" stroke="#16a34a" stroke-width="24"/>
        <path d="M178 136a54 54 0 0 1-80 22" fill="none" stroke="#f59e0b" stroke-width="24"/>
        <text x="103" y="118" font-size="20" font-weight="800" fill="#061947">18%</text>
      </g>
      <g transform="translate(478 214)">
        <rect width="196" height="196" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="22" y="34" font-size="18" font-weight="800" fill="#061947">Validation</text>
        <text x="24" y="78" font-size="15" fill="#172554">HSN Rate Match</text><text x="154" y="78" font-size="18" fill="#16a34a">OK</text>
        <text x="24" y="118" font-size="15" fill="#172554">Duplicate Invoice</text><text x="154" y="118" font-size="18" fill="#16a34a">OK</text>
        <text x="24" y="158" font-size="15" fill="#172554">ITC Mismatch</text><text x="154" y="158" font-size="18" fill="#dc2626">!</text>
      </g>
    </g>
  </g>
  <g transform="translate(1238 236)" font-family="Arial, Helvetica, sans-serif">
    <rect width="228" height="364" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="36" y="56" font-size="22" font-weight="800" fill="#061947">Monthly Summary</text>
    <rect x="28" y="88" width="172" height="48" rx="12" fill="#eff6ff"/><text x="46" y="119" font-size="17" fill="#0b56c5">GSTR-1 Ready</text>
    <rect x="28" y="154" width="172" height="48" rx="12" fill="#ecfdf5"/><text x="46" y="185" font-size="17" fill="#047857">3B Prepared</text>
    <rect x="28" y="220" width="172" height="48" rx="12" fill="#fff7ed"/><text x="46" y="251" font-size="17" fill="#c2410c">ITC Review</text>
    <text x="56" y="324" font-size="52" font-weight="800" fill="#0b56c5">₹</text>
  </g>
  <g transform="translate(68 764)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1400" height="66" rx="18" fill="#0b56c5"/>
    <text x="54" y="42" font-size="19" font-weight="700" fill="#fff">Accurate Tax Calculation</text>
    <text x="372" y="42" font-size="19" font-weight="700" fill="#fff">Faster Reconciliation</text>
    <text x="704" y="42" font-size="19" font-weight="700" fill="#fff">Lower Manual Errors</text>
    <text x="1028" y="42" font-size="19" font-weight="700" fill="#fff">Audit-Ready Reports</text>
  </g>
</svg>
