<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">GST Calculation Automation</title>
  <desc id="desc">Dashboard style illustration for GST calculation automation with tax summary, invoices, reconciliation, and compliance checks.</desc>
  <rect width="1536" height="864" fill="#eef6ff"/>
  <circle cx="1286" cy="116" r="210" fill="#dbeafe" opacity="0.7"/>
  <circle cx="164" cy="738" r="220" fill="#dcfce7" opacity="0.55"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#061947">
    <text x="52" y="92" font-size="66" font-weight="800">GST CALCULATION</text>
    <text x="52" y="154" font-size="50" font-weight="800" fill="#0b56c5">AUTOMATION</text>
    <rect x="52" y="182" width="442" height="50" rx="14" fill="#0b56c5"/>
    <text x="78" y="216" font-size="24" font-weight="700" fill="#ffffff">Calculate. Validate. Reconcile. File.</text>
    <text x="52" y="284" font-size="25">Automate GST calculation, ITC checks,</text>
    <text x="52" y="320" font-size="25">tax reconciliation, invoice validation,</text>
    <text x="52" y="356" font-size="25">and compliance-ready reporting.</text>
  </g>
  <g transform="translate(50 410)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#061947">KEY FEATURES</text>
    <rect x="0" y="18" width="160" height="3" fill="#0b56c5"/>
    <g transform="translate(0 58)">
      <rect width="56" height="56" rx="14" fill="#0b56c5"/><text x="16" y="38" font-size="28" font-weight="800" fill="#fff">%</text>
      <text x="78" y="22" font-size="20" font-weight="800" fill="#061947">AUTOMATED GST CALCULATION</text><text x="78" y="52" font-size="18" fill="#172554">CGST, SGST, and IGST calculation.</text>
    </g>
    <g transform="translate(0 132)">
      <rect width="56" height="56" rx="14" fill="#0b56c5"/><text x="15" y="38" font-size="28" font-weight="800" fill="#fff">ITC</text>
      <text x="78" y="22" font-size="20" font-weight="800" fill="#061947">INPUT TAX CREDIT REVIEW</text><text x="78" y="52" font-size="18" fill="#172554">Match eligible credits and exceptions.</text>
    </g>
    <g transform="translate(0 206)">
      <rect width="56" height="56" rx="14" fill="#0b56c5"/><text x="16" y="38" font-size="28" font-weight="800" fill="#fff">HSN</text>
      <text x="78" y="22" font-size="20" font-weight="800" fill="#061947">HSN AND SAC VALIDATION</text><text x="78" y="52" font-size="18" fill="#172554">Verify tax rates and item mapping.</text>
    </g>
  </g>
  <g transform="translate(448 198)">
    <rect width="750" height="504" rx="26" fill="#0f172a" opacity="0.18"/>
    <rect x="0" y="0" width="736" height="492" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="0" y="0" width="154" height="492" rx="24" fill="#073b91"/>
    <rect x="0" y="432" width="154" height="60" fill="#073b91"/>
    <g font-family="Arial, Helvetica, sans-serif">
