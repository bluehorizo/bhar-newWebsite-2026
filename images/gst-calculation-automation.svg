      <rect x="22" y="96" width="110" height="34" rx="8" fill="#2563eb"/><text x="42" y="119" font-size="14" fill="#fff">Dashboard</text>
      <text x="38" y="168" font-size="14" fill="#bfdbfe">Invoices</text><text x="38" y="214" font-size="14" fill="#bfdbfe">GST Rates</text><text x="38" y="260" font-size="14" fill="#bfdbfe">ITC Match</text><text x="38" y="306" font-size="14" fill="#bfdbfe">Reports</text>
